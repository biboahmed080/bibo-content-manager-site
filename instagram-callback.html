<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BIBO Content Manager — Instagram Connection</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0f14;
      color: #f8fafc;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(255, 193, 7, .12), transparent 36rem),
        #0b0f14;
    }
    main {
      width: min(92vw, 560px);
      padding: 28px;
      border: 1px solid #2a313c;
      border-radius: 18px;
      background: #131820;
      box-shadow: 0 22px 80px rgba(0,0,0,.35);
    }
    .brand {
      color: #ffc107;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 16px; color: #b4bdc8; line-height: 1.6; }
    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #0b0f14;
      border: 1px solid #2a313c;
      word-break: break-word;
    }
    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 800;
      background: #ffc107;
      color: #0b0f14;
      cursor: pointer;
    }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">BIBO CONTENT MANAGER</div>
    <h1>Returning to the desktop app…</h1>
    <p>
      Instagram authorization has returned to BIBO Content Manager.
      This page only forwards the OAuth response to the local desktop app.
    </p>
    <div id="status" class="status">Preparing secure local handoff…</div>
    <button id="retry" type="button" hidden>Return to BIBO Content Manager</button>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const state = params.get("state") || "";
      const match = /^biboig_(\d{2,5})_[A-Za-z0-9_-]{16,}$/.exec(state);
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");

      if (!match) {
        status.textContent =
          "The authorization response is missing a valid BIBO session state. Return to the app and start Instagram Connect again.";
        return;
      }

      const port = Number(match[1]);

      if (!Number.isInteger(port) || port < 1024 || port > 65535) {
        status.textContent =
          "The local callback port is invalid. Return to the app and start Instagram Connect again.";
        return;
      }

      const target =
        `http://127.0.0.1:${port}/instagram/callback/?${params.toString()}`;

      const go = () => {
        window.location.replace(target);
      };

      retry.hidden = false;
      retry.addEventListener("click", go);

      status.textContent =
        "Opening BIBO Content Manager. If nothing happens, use the button below.";

      setTimeout(go, 250);
    })();
  </script>
</body>
</html>
